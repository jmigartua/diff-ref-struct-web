# The releases of diff-ref-struct Web, newest first: the single source of the Releases page, Appendix B (Release notes)
# of every manual edition (the releases up to that edition's version), web/CHANGELOG.md, the releases' Atom feed, the
# page's version (web/tools/stage.mjs reads the first entry), the known-issues box and CITATION.cff's version.
# Semantic versions from 1.0.0 (decided 26 October 2026); the earlier builds numbered after the fact, their build kept.
# Fields: version, build (commit, "next" until published), core, date, status (next | released | internal), title,
# summary, added / changed / fixed / known (lists), closes (requests: W…, #…), log (the project's entries), evidence.
- version: "1.1.0"
  build: next
  core: "0.82.0"
  date: "2026-10-27"
  status: next
  title: "The 2θ interval of the analysis"
  summary: >-
    On core 0.82.0: a plot set file may cut every member to an interval of 2θ on opening, so that every view, window,
    map and difference works on the cut set; the core answers the patterns in the app's words.
  added:
    - "A set file's `x_interval = [from, to]` cuts every member to that interval of 2θ as the set opens (core 0.82.0, PL42): the views, windows, maps, the colour range and the differences are those of the cut set, and a window outside it is refused. A beamstop's first degree, or a range of no interest, is left out once for the whole analysis. Typed in the .drv for now; a control in the page comes with the Plots module's step 25."
  changed:
    - "The core in the page is 0.82.0."
    - "The core names each pattern's member as the app does (W11 met); the page's own rename stays as a fallback."
  known:
    - "No control in the page for the 2θ interval yet: type `x_interval` in the set file."
    - "Proposals against time open with each scan's temperature as its variable: open a hold or a run from a .drv that types the times (recipe: A hold)."
    - "No figure or CSV export in the browser; text formats only."
  closes: [W11]
  log: [L435, L441, L442]
  evidence: "Web host tests 39 of 39 and the package's 10 of 10 on core 0.82.0; a Tb₂Pd₂Sn set file cut to 24–36° opened in the page on its Map (24 to 36°, the cut set's colour range 2.982–4.605 log₁₀ counts); every view drawn; the leak guard clean on the guide, its PDFs and the source."
- version: "1.0.0"
  build: b4820d8
  core: "0.81.0"
  date: "2026-10-27"
  status: released
  doi: "10.5281/zenodo.23682727"
  title: "The guide, open source, the record"
  summary: >-
    The page gains its own site, a licence and a citation, a place for requests, and a record (releases, log, roadmap,
    conventions) that the site and the manuals render; versions become semantic.
  added:
    - "The guide at /guide/: overview, a five-minute start with a check of what the browser supports, the manual and a one-page quick reference (HTML and PDF), five recipes, how it works, formats, conventions, releases, log, roadmap, requests, about."
    - "The manuals as PDF, typeset by LuaLaTeX in the site's typefaces; every edition with three appendices: Conventions, Release notes, Roadmap."
    - "The guide offline: after a first visit the guide's pages and the manual's PDFs open without network, as the page does."
    - "A Help menu in the page: the guide, the manual at the section of the view shown, what's new, Report a problem…, Ask for a feature…, Cite this view."
    - "Try the example: a synthetic heating run computed by the core (21 scans, 300 to 1300 K, a second phase appearing), opened as if a folder had been dropped."
    - "Open source: the code under the Apache License 2.0, the guide, manuals and screenshots under CC BY 4.0; CITATION.cff; issue forms for bugs and features."
    - "Semantic versions: diff-ref-struct Web 1.0.0, with the core's version and the build beside it."
  fixed:
    - "The Overlay draws its curves: the browser's core named each pattern's member `index` where the page reads `member`; the page reads both (a rename, no number touched)."
    - "Sum, Average and Difference of Members download their file (they were computed and lost)."
  known:
    - "Proposals against time open with each scan's temperature as its variable: open a hold or a run from a .drv that types the times (recipe: A hold)."
    - "No figure or CSV export in the browser; text formats only."
  closes: [W11]
  log: [L431, L433, L434]
  evidence: "Web host tests 40 of 40 with the core 0.81.0 package; every guide screenshot taken from the app in both themes; the public PDFs and the guide checked for team data by the leak guard."
