<!doctype html>
<!-- diff-ref-struct Web · the browser host (I10 step 2, R34; web/DESIGN.md). The app's shell files and the Plots module
     are loaded as they are from app/ui/ (../), behind the dispatcher onto the core in WebAssembly (dispatch.js; the
     package in wasm/, request W1). The user's files are read in this browser and never uploaded. Served as a static
     folder: `python3 -m http.server` in app/ui/, then /host-web/. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>diff-ref-struct Web</title>
  <meta name="description" content="Powder diffraction data as plot sets in the browser: the diff-ref-struct core in WebAssembly, your files read here and never uploaded.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath d='M2.5 15.5H6l1.5-4.5L9 15.5h8.5M2.5 11.5h4l1.5-4 1.5 4h8M2.5 7.5H7l1.5-4L10 7.5h7.5' fill='none' stroke='%230a7f6f' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#0a7f6f">
  <link rel="stylesheet" href="./vendor/dockview/dockview.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="host.css">
</head>
<body class="wh">
  <header class="wh-bar">
    <span class="wh-brand">diff-ref-struct <b>Web</b></span>
    <button id="btn-folder" title="Open Folder…: a folder of data files, listed in the inspector and read in this browser only">Open Folder…</button>
    <button id="btn-files" title="Open Files…: data files, a plot set (.drv) or a WinPLOTR buffer (.buf), opened in Plots">Open Files…</button>
    <div class="wh-menuwrap">
      <button id="btn-plots" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-plots" title="The Plots module's menu, as the app's menu bar lists it">Plots ▾</button>
      <div id="menu-plots" class="wh-menu" role="menu" aria-label="Plots" hidden></div>
    </div>
    <span class="wh-gap"></span>
    <span id="core-chip" class="wh-chip off" role="status">core: waiting for W1</span>
    <button id="btn-theme" class="quiet" title="Appearance">◐ auto</button>
  </header>

  <main class="wh-main">
    <aside id="insp" class="wh-insp" aria-label="Inspector">
      <div class="wh-insp-head">
        <button id="btn-rail" class="small" aria-controls="insp-scroll">&lt;</button>
        <span class="wh-insp-title">Folder</span><span id="folder-name" class="sub"></span>
      </div>
      <div id="insp-scroll" class="wh-scroll">
        <section class="wh-sec">
          <div class="sec-head"><span>Files</span><span class="switch" id="tree-by" role="group" aria-label="List the files by"><button data-by="folders" title="The folder's files in its folders">folders</button><button data-by="kinds" title="The folder's files by what the core says they are (its describe)">kinds</button></span><span class="sub" id="tree-count"></span></div>
          <div class="wh-actions"><button id="btn-openset" class="small" disabled title="The files chosen in the tree opened in Plots as one plot set (a .drv or a .buf alone opens as itself)">Open as Plot Set</button></div>
          <div id="live" class="wh-live" hidden>
            <label title="Live mode: the folder read again every few seconds (Chromium, a folder opened by Open Folder… or dropped): new files appear, and a set opened from a proposal grows with the new scans; a file that vanishes is said, never removed from a set"><input type="checkbox" id="live-on"> Live</label>
            <label>every <select id="live-every" aria-label="Read the folder again every"></select></label>
            <button class="small" id="live-now" title="Read the folder again now">Now</button>
            <div class="sub" id="live-line" role="status" aria-live="polite"></div>
          </div>
          <div id="tree" class="wh-tree" role="tree" aria-label="The folder's files" aria-multiselectable="true"></div>
        </section>
        <section id="proposals" class="wh-sec wh-proposals" aria-label="The sets the core proposes in this folder"></section>
        <section id="members" class="wh-sec wh-members" aria-label="The plot set's members"></section>
        <details class="wh-sec wh-member"><summary class="sec-head"><span>The member</span></summary><div id="member" class="wh-member-body"></div></details>
      </div>
      <p class="wh-local">Your files are read in this browser and never leave this machine: nothing is uploaded.<br><span id="offline-line"></span></p>
    </aside>
    <div id="sep" class="wh-sep" role="separator" aria-orientation="vertical" aria-label="Inspector width" aria-controls="insp" aria-valuemin="220" aria-valuemax="640" tabindex="0" title="Drag to set the inspector's width (← → with the keyboard); a double-click shrinks it to a rail and back"></div>
    <section class="wh-views" aria-label="Views"><div id="dock" class="wh-dock"></div></section>
  </main>

  <footer class="statusbar"><span class="msg" id="status" role="status" aria-live="polite">Starting…</span></footer>

  <input id="in-folder" type="file" webkitdirectory multiple hidden>
  <input id="in-files" type="file" multiple hidden>

  <!-- the shell's dialogs (core.js's askText, askForm, pickOne), the app's markup -->
  <dialog id="dlg-form" class="explained">
    <h2 id="dlg-form-title">Edit</h2>
    <p class="sub" id="dlg-form-text"></p>
    <div id="dlg-form-fields"></div>
    <div class="actions"><button class="quiet" id="dlg-form-cancel">Cancel</button><button class="primary" id="dlg-form-ok">OK</button></div>
  </dialog>
  <dialog id="dlg-pick">
    <h2 id="dlg-pick-title">Choose</h2>
    <p class="sub" id="dlg-pick-text"></p>
    <label class="row"><span>Choice</span><select id="dlg-pick-select" class="wide"></select></label>
    <div class="actions"><button class="quiet" id="dlg-pick-cancel">Cancel</button><button class="primary" id="dlg-pick-ok">OK</button></div>
  </dialog>
  <dialog id="dlg-name">
    <h2 id="dlg-name-title">Name</h2>
    <p class="sub" id="dlg-name-text"></p>
    <label class="row"><span id="dlg-name-label">Name</span><input id="dlg-name-input" type="text" size="28" spellcheck="false"></label>
    <div class="actions"><button class="quiet" id="dlg-name-cancel">Cancel</button><button class="primary" id="dlg-name-ok">Create</button></div>
  </dialog>

  <script type="module" src="host.js"></script>
</body>
</html>
