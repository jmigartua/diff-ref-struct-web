[package]
name = "drs-wasm"
# The core's version: the package is the core's (W1, L424).
version = "0.81.0"
edition = "2021"
description = "The diff-ref-struct core in the browser: the Plots module's commands in WebAssembly (W1, I10, R34)"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
drs = { path = "..", features = ["serde"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
# Small and fast in the browser: the whole program optimised at once.
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
